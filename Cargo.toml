[workspace]
members = [
    ".",
    "crates/ca-watch",
    "crates/ca-automation",
    "crates/ca-automation-protocol",
    "crates/codex-team",
    "crates/codex-team-protocol",
]
default-members = [
    ".",
    "crates/ca-watch",
    "crates/ca-automation",
    "crates/ca-automation-protocol",
    "crates/codex-team",
    "crates/codex-team-protocol",
]
resolver = "2"

[workspace.package]
license = "MIT OR Apache-2.0"

[package]
name = "ca"
version = "0.1.212"
edition = "2021"
license.workspace = true
default-run = "ca"

[features]
default = []
planner-executor-experiment = []

[[bin]]
name = "ca-reasoning-artifact-experiment"
path = "src/bin/reasoning_artifact_experiment.rs"
required-features = ["planner-executor-experiment"]

[dependencies]
agent-client-protocol = { version = "=2.0.0", default-features = false }
ca-watch = { path = "crates/ca-watch" }
ca-automation = { path = "crates/ca-automation" }
codex-team = { path = "crates/codex-team" }
ca-automation-protocol = { path = "crates/ca-automation-protocol" }
codex-team-protocol = { path = "crates/codex-team-protocol" }
ratatui = { version = "0.29", features = ["unstable-rendered-line-info"] }
crossterm = "0.28"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream", "multipart", "gzip", "brotli", "deflate", "zstd"] }
reqwest_13 = { package = "reqwest", version = "0.13", default-features = false, features = ["form", "json", "stream", "rustls"] }
http = "1"
sse-stream = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
serde_yaml_ng = "0.10"
semver = "1"
globset = "0.4"
schemars = "0.8"
toml = "0.8"
toml_edit = { version = "0.22", features = ["serde"] }
nucleo = "0.5"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = { version = "0.10", features = ["serde"] }
cron = "0.15"
hmac = "0.12"
uuid = { version = "1", features = ["serde", "v4", "v5"] }

clap = { version = "4", features = ["derive"] }
futures = "0.3"
flate2 = "1"
tokio-stream = "0.1"
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "handshake"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
async-imap = { version = "=0.11.3", default-features = false, features = ["runtime-tokio"] }
mail-parser = "=0.11.5"
tokio-rustls = "=0.26.4"
rustls-platform-verifier = "=0.7.0"
pulldown-cmark = "0.12"
mmdflux = { version = "=2.6.1", default-features = false }
unicode-segmentation = "1.12"
unicode-width = "0.2"
regex = "1"
aho-corasick = "1"
pdf-extract = "=0.12.0"
syntect = { version = "5", default-features = false, features = ["parsing", "regex-onig", "default-syntaxes", "default-themes"] }
tree-sitter = "=0.25.10"
tree-sitter-c = "=0.24.2"
tree-sitter-cpp = "=0.23.4"
tree-sitter-go = "=0.25.0"
tree-sitter-rust = "=0.24.2"
tree-sitter-python = "=0.25.0"
tree-sitter-bash = "=0.25.1"
tree-sitter-javascript = "=0.25.0"
tree-sitter-typescript = "=0.23.2"
tree-sitter-html = "=0.23.2"
tree-sitter-css = "=0.25.0"
tree-sitter-json = "=0.24.8"
tree-sitter-yaml = "=0.7.2"
tree-sitter-toml-ng = "=0.7.0"
glob = "0.3"
base64 = "0.22"
walkdir = "2.5"
arboard = "3.4"
image = "0.25"
sha2 = { version = "0.10", features = ["asm"] }
zstd = "=0.13.3"
ignore = "0.4"
ring = "0.17"
tempfile = "3"
tar = "0.4"
rmcp = { version = "=3.1.2", default-features = false, features = ["auth", "client", "transport-child-process", "transport-streamable-http-client-reqwest"] }
nix = { version = "0.31", features = ["signal"] }
libc = "0.2"
jsonschema = { version = "0.33", default-features = false }
oauth2 = { version = "5", default-features = false }
url = "2"
percent-encoding = "2"
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
google-cloud-auth = "=1.17.0"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7"
cpal = "0.16"
hound = "3.5"

# Linux-only. This revision is not compiled or linked into the macOS binary.
[target.'cfg(target_os = "linux")'.dependencies]
nono = { version = "=0.81.0", default-features = false, git = "https://github.com/nolabs-ai/nono.git", rev = "e9796cca01eb863a9a83e96c18ae6120aa50beb1" }

[dev-dependencies]
insta = "1"
tokio-util = { version = "0.7", features = ["compat"] }

[build-dependencies]
sha2 = "0.10"

# Broker identity hashes must finish within the normal startup deadline even
# when SHA-256 uses its software implementation in development builds.
[profile.dev.package."sha2:0.10.9"]
opt-level = 3

[profile.test.package."sha2:0.10.9"]
opt-level = 3
