[package]
name = "codex-team"
version = "0.1.0"
edition = "2021"
default-run = "codex-team"
license.workspace = true
description = "Legacy CLI and library compatibility adapters for ca automation"

[dependencies]
ca-automation = { path = "../ca-automation" }
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }

[dev-dependencies]
toml = "0.8"
ca-watch = { path = "../ca-watch" }
codex-team-protocol = { path = "../codex-team-protocol" }
chrono = { version = "0.4", features = ["serde"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread", "sync", "time"] }
rmcp = { version = "=3.1.2", features = ["client", "transport-child-process", "transport-io"] }
