deferred:
  - id: hermes_mcp
    reason: CLI POC checklist in docs/HERMES_IMPLEMENTATION_GUIDE.md not operator-checked-off
  - id: hermes_worker_provider
    reason: Phase 4 after Phase 2 contracts; nested orchestration anti-pattern
  - id: auto_route_local_models
    reason: Operator sets roles.*.provider; no scorecard auto-pick in v1
  - id: provider_codex_fallback
    reason: Explicit fail-closed; no silent fallback when Ollama/MLX disabled or down

cli_surface:
  stdout_rule: >
    When --json is set on step|status|disposition|doctor, stdout is exactly one JSON
    object. Human progress is redirected to stderr via MachineJsonModeGuard.
  stdin_rule: >
    Non-interactive step must close stdin (</dev/null). Non-TTY stops on human
    disposition instead of blocking.
  lock_rule: >
    Mutating commands acquire .orchestrator/codex-team.lock. status --observe still
    locks but skips queue recover/save.
  commands:
    - name: step
      argv: ["codex-team", "step", "--repo", "$REPO", "--json"]
      stdin: closed
      stdout_schema: schemas/cycle_receipt.schema.json
      outcomes: [continue, stopped, paused, no_work]
      on_paused: notify_human_then_disposition
    - name: status
      argv: ["codex-team", "status", "--repo", "$REPO", "--json"]
      stdout_schema: schemas/status_receipt.schema.json
      notes: may mutate/save state under lock
    - name: status_observe
      argv: ["codex-team", "status", "--repo", "$REPO", "--json", "--observe"]
      stdout_schema: schemas/status_receipt.schema.json
      notes: observe=true; no queue recover/save
    - name: disposition
      argv:
        - codex-team
        - disposition
        - --repo
        - $REPO
        - --decision
        - "$DECISION"
        - --json
      decisions: [preserve, recheck, gate, keep-paused]
      optional_flags: ["--refresh-report"]  # keep-paused only
      stdout_schema: schemas/disposition_receipt.schema.json
      outcomes: [kept_paused, no_pause, recorded]
    - name: doctor
      argv: ["codex-team", "doctor", "--repo", "$REPO", "--json"]
      stdout_schema: schemas/doctor_receipt.schema.json
    - name: supervisor_loop
      path: scripts/hermes_supervisor_loop.sh
      argv: ["scripts/hermes_supervisor_loop.sh", "$REPO", "5"]
      env: [CODEX_TEAM]

receipts:
  protocol_version: 1
  cycle:
    schema: schemas/cycle_receipt.schema.json
    rust: src/app/receipts.rs::CycleReceipt
    fields:
      protocol_version: { type: integer, const: 1 }
      cycle_id:
        type: string
        notes: correlates with events.jsonl cycle_receipt transition
      repo: { type: string }
      outcome:
        type: string
        enum: [continue, stopped, paused, no_work]
      mission: { type: string }
      planner_due: { type: boolean }
      master_due: { type: boolean }
      queue_len: { type: integer }
      human_disposition_required: { type: boolean }
      pause:
        type: object_or_null
        shape:
          reason: string
          options: list_of_string
          source: string
      events_path: { type: string }
  status:
    schema: schemas/status_receipt.schema.json
    rust: src/app/receipts.rs::StatusReceipt
    fields:
      protocol_version: { type: integer, const: 1 }
      repo: { type: string }
      mission: { type: string }
      project_complete: { type: boolean }
      planner_due: { type: boolean }
      master_due: { type: boolean }
      queue:
        type: array
        item:
          task_id: string
          kind: string
          title: string
          status: string
      human_disposition_required:
        type: object_or_null
        shape:
          reason: string
          options: list_of_string
          source: string
      events_path: { type: string }
      observe: { type: boolean }
  disposition:
    schema: schemas/disposition_receipt.schema.json
    rust: src/app/receipts.rs::DispositionReceipt
    fields:
      protocol_version: { type: integer, const: 1 }
      repo: { type: string }
      outcome:
        type: string
        enum: [kept_paused, no_pause, recorded]
      decision: { type: string }
      refresh_report: { type: boolean }
      human_disposition_required: { type: boolean }
      pause: { type: object_or_null }
      events_path: { type: string }
  doctor:
    schema: schemas/doctor_receipt.schema.json
    rust: src/app/receipts.rs::DoctorReceipt
    fields:
      protocol_version: { type: integer, const: 1 }
      repo: { type: string }
      healthy:
        type: boolean
        notes: all checks.ok
      initialized: { type: boolean }
      checks:
        type: array
        item:
          name: string
          ok: boolean
          detail: string
    known_check_names:
      - initialized
      - config
      - codex
      - git
      - "project_file:*"
      - roles
      - ollama
      - mlx_lm
      - "model:*"
      - model_list

providers:
  schema: schemas/provider_config.schema.json
  role_provider_enum: [codex, ollama, mlx_lm]
  role_provider_aliases:
    "mlx-lm": mlx_lm
  default_provider: codex
  fail_closed: true
  no_silent_codex_fallback: true
  config:
    ollama:
      toml_table: ollama
      enabled_default: false
      base_url_default: http://127.0.0.1:11434
      chat_path: /v1/chat/completions
      health_path: /api/tags
      rust_module: src/providers/ollama.rs
    mlx_lm:
      toml_table: mlx_lm
      enabled_default: false
      base_url_default: http://127.0.0.1:8080
      chat_path: /v1/chat/completions
      health_path: /v1/models
      rust_module: src/providers/mlx_lm.rs
      server_hint: "mlx_lm.server --model <hf_or_path> [--port 8080]"
  role_config_example: |
    [ollama]
    enabled = false
    base_url = "http://127.0.0.1:11434"

    [mlx_lm]
    enabled = false
    base_url = "http://127.0.0.1:8080"

    [roles.worker]
    provider = "codex"
    model = "gpt-5.4-mini"
    timeout_seconds = 900
  ignored_codex_fields_when_local_http:
    - sandbox
    - approval_policy
    - web_search
    - effort
  telemetry:
    ai_escalation_payload_includes: [role, reason, model, provider, effort]
    cost_jsonl_provider_field: optional string ollama or mlx_lm
    run_artifacts:
      ollama: ".orchestrator/runs/*-ollama.{prompt.md,ollama.json,stderr.log}"
      mlx_lm: ".orchestrator/runs/*-mlx_lm.{prompt.md,mlx_lm.json,stderr.log}"

events:
  cycle_receipt_transition:
    kind: StateTransitionApplied
    payload_keys: [transition, cycle_id, outcome]
    transition_value: cycle_receipt
  path: .orchestrator/events.jsonl

hermes_integration:
  skill_draft: docs/hermes-skill-draft.md
  short_contract: docs/HERMES.md
  operator_guide: docs/HERMES_IMPLEMENTATION_GUIDE.md
  loop_script: scripts/hermes_supervisor_loop.sh
  outcome_actions:
    continue: optionally_capped_another_step
    no_work: stop_or_change_backlog_via_human
    stopped: inspect_status_or_events_before_loop
    paused: notify_human_run_disposition_after_choice

pointers:
  agent_map: docs/AGENT_MAP.md
  continuity: CONTINUITY.md
  testing: TESTING.md
  architecture: ARCHITECTURE.md
  this_catalog: docs/MACHINE_ACCOMPLISHMENTS.yaml
  human_index: docs/ACCOMPLISHMENTS.md
